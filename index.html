<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>fwme</title>

  <!-- Open Graph -->
  <meta property="og:title" content="do u (F)Wme?" />
  <meta property="og:description" content="fwme playlist" />
  <meta property="og:image" content="https://fwmedot.github.io/IMG_1040.jpeg" />
  <meta property="og:url" content="https://fwmedot.github.io" />
  <meta property="og:type" content="website" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #000;
      color: #eaeaea;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Courier New", monospace;
      font-size: 18px;
      letter-spacing: 1px;
    }

    .container {
      text-align: center;
      width: 260px;
      user-select: none;
    }

    .text {
      margin-bottom: 10px;
      position: relative;
    }

    .glitch::after {
      content: attr(data-text);
      position: absolute;
      left: 1px;
      top: 0;
      opacity: 0.2;
      animation: glitch 2.8s infinite;
    }

    @keyframes glitch {
      0% { opacity: 0; }
      92% { opacity: 0; }
      94% { opacity: 0.25; }
      96% { opacity: 0; }
      100% { opacity: 0; }
    }

    .dots::after {
      content: "";
      animation: dots 1.5s infinite;
    }

    @keyframes dots {
      0% { content: ""; }
      33% { content: "."; }
      66% { content: ".."; }
      100% { content: "..."; }
    }

    .bar {
      width: 100%;
      height: 6px;
      border: 1px solid #eaeaea;
      margin-top: 14px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: #eaeaea;
      transition: width 0.15s linear;
    }

    .secret {
      margin-top: 14px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.6s ease;
      position: relative;
    }

    .secret.glitch-once::after {
      content: attr(data-text);
      position: absolute;
      left: 1px;
      top: 0;
      opacity: 0.35;
      animation: secretGlitch 0.4s linear 1;
    }

    @keyframes secretGlitch {
      0% { opacity: 0; }
      30% { opacity: 0.35; }
      60% { opacity: 0.15; }
      100% { opacity: 0; }
    }

    /* visitas ocultas (debug) */
    .visits {
      font-size: 10px;
      opacity: 0.15;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="text glitch" data-text="do u (F)Wme?">do u (F)Wme?</div>
    <div class="dots" id="status">loading</div>

    <div class="bar">
      <div class="bar-fill" id="bar"></div>
    </div>

    <div class="secret" id="secret" data-text="Dn’t(F)Wme">Dn’t(F)Wme</div>

    <!-- opcional: contador oculto -->
    <div class="visits" id="visits"></div>
  </div>

  <script>
    /* ===============================
       ANALYTICS — COUNTAPI
       =============================== */

    const COUNT_KEY = "fwmedot.github.io/fwme";

    // suma visita
    fetch(`https://api.countapi.xyz/hit/${COUNT_KEY}`)
      .then(res => res.json())
      .then(data => {
        console.log("Visitas totales:", data.value);
        document.getElementById("visits").textContent =
          `visits: ${data.value}`;
      })
      .catch(() => {});

    /* ===============================
       TU SCRIPT ORIGINAL
       =============================== */

    const bar = document.getElementById("bar");
    const status = document.getElementById("status");
    const secret = document.getElementById("secret");

    const messages = [
      "loading",
      "tuning frequency",
      "finding fwme",
      "almost there"
    ];

    let progress = 0;
    let index = 0;
    let revealed = false;

    const interval = setInterval(() => {
      if (progress < 90) {
        progress += Math.random() * 8;
        bar.style.width = progress + "%";

        status.textContent = messages[index % messages.length];
        document.title = messages[index % messages.length];
        index++;
      }
    }, 400);

    setTimeout(() => {
      clearInterval(interval);

      setTimeout(() => {
        bar.style.width = "100%";
        status.textContent = "ready";
        document.title = "fwme";

        setTimeout(() => {
          window.location.href =
            "https://open.spotify.com/playlist/6Z5EsoedIB4Cgxwv3epoIq";
        }, 600);
      }, 600);
    }, 3200);

    /* easter egg */
    document.body.addEventListener("click", () => {
      if (revealed) return;

      secret.style.opacity = "1";
      secret.classList.add("glitch-once");
      revealed = true;
    });
  </script>
</body>
</html>
