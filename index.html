<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>fwme</title>

  <!-- Open Graph -->
  <meta property="og:title" content="do u (F)Wme?" />
  <meta property="og:description" content="fwme ritual" />
  <meta property="og:image" content="https://fwmedot.github.io/IMG_1040.jpeg" />
  <meta property="og:url" content="https://fwmedot.github.io" />
  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary_large_image" />

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #000;
      color: #eaeaea;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Courier New", monospace;
      font-size: 18px;
      letter-spacing: 1px;
      cursor: default;
    }

    .container {
      text-align: center;
      width: 260px;
      user-select: none;
    }

    .text {
      margin-bottom: 10px;
      position: relative;
    }

    .glitch::after {
      content: attr(data-text);
      position: absolute;
      left: 1px;
      top: 0;
      opacity: 0.2;
      animation: glitch 3s infinite;
    }

    @keyframes glitch {
      0% { opacity: 0; }
      94% { opacity: 0; }
      96% { opacity: 0.25; }
      98% { opacity: 0; }
      100% { opacity: 0; }
    }

    .dots::after {
      content: "";
      animation: dots 1.6s infinite;
    }

    @keyframes dots {
      0% { content: ""; }
      33% { content: "."; }
      66% { content: ".."; }
      100% { content: "..."; }
    }

    .bar {
      width: 100%;
      height: 6px;
      border: 1px solid #eaeaea;
      margin-top: 14px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: #eaeaea;
      transition: width 0.1s linear;
    }

    .choices {
      margin-top: 18px;
      display: none;
      font-size: 14px;
      line-height: 1.8;
    }

    .choice {
      cursor: pointer;
      opacity: 0.85;
    }

    .choice:hover {
      opacity: 1;
      text-decoration: underline;
    }

    .visits {
      font-size: 10px;
      opacity: 0.15;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="text glitch" data-text="do u (F)Wme?">do u (F)Wme?</div>
    <div class="dots" id="status">waiting</div>

    <div class="bar">
      <div class="bar-fill" id="bar"></div>
    </div>

    <div class="choices" id="choices">
      <div class="choice" onclick="openPlaylist('a')">→ fwme</div>
      <div class="choice" onclick="openPlaylist('b')">→ dn’t fwme</div>
    </div>

    <div class="visits" id="visits"></div>
  </div>

  <!-- AUDIO DEL VIDEO (RAÍZ DEL REPO) -->
  <audio id="ritualAudio" preload="auto">
    <source src="january.mp3" type="audio/mpeg">
  </audio>

  <script>
    const COUNT_KEY = "fwmedot.github.io/fwme";

    fetch(`https://api.countapi.xyz/hit/${COUNT_KEY}`)
      .then(res => res.json())
      .then(data => {
        document.getElementById("visits").textContent =
          `visits: ${data.value}`;
      })
      .catch(() => {});

    const bar = document.getElementById("bar");
    const status = document.getElementById("status");
    const choices = document.getElementById("choices");
    const audio = document.getElementById("ritualAudio");

    let audioStarted = false;

    // sincroniza barra con duración real del audio
    audio.addEventListener("timeupdate", () => {
      if (!audio.duration) return;
      const percent = (audio.currentTime / audio.duration) * 100;
      bar.style.width = percent + "%";
    });

    audio.addEventListener("ended", () => {
      bar.style.width = "100%";
      status.textContent = "choose";
      choices.style.display = "block";
    });

    function openPlaylist(type) {
      const playlists = {
        a: "https://open.spotify.com/playlist/6Z5EsoedIB4Cgxwv3epoIq",
        b: "https://open.spotify.com/playlist/69oj2W3LiWH9OsYRF3JFRs"
      };
      window.location.href = playlists[type];
    }

    // activar audio con primer toque (sin sonido de click)
    document.body.addEventListener("click", () => {
      if (audioStarted) return;
      audio.volume = 0.4;
      audio.play().catch(() => {});
      status.textContent = "listening";
      audioStarted = true;
    }, { once: true });
  </script>
</body>
</html>
