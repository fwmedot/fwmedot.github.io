<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>do u (F)Wme?</title>

  <!-- Open Graph -->
  <meta property="og:title" content="do u (F)Wme?" />
  <meta property="og:description" content="fwme playlist" />
  <meta property="og:image" content="https://fwmedot.github.io/IMG_1040.jpeg" />
  <meta property="og:url" content="https://fwmedot.github.io" />
  <meta property="og:type" content="website" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      letter-spacing: 1px;
    }

    .container {
      text-align: center;
      width: 260px;
    }

    .text {
      margin-bottom: 12px;
    }

    .dots::after {
      content: "";
      animation: dots 1.5s infinite;
    }

    @keyframes dots {
      0% { content: ""; }
      33% { content: "."; }
      66% { content: ".."; }
      100% { content: "..."; }
    }

    .bar {
      width: 100%;
      height: 6px;
      border: 1px solid #fff;
      margin-top: 12px;
      position: relative;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: #fff;
      animation: loading 3.5s linear forwards;
    }

    @keyframes loading {
      from { width: 0%; }
      to { width: 100%; }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="text">do u (F)Wme?</div>
    <div class="dots">loading</div>
    <div class="bar">
      <div class="bar-fill"></div>
    </div>
  </div>

  <script>
    setTimeout(() => {
      window.location.href = "https://open.spotify.com/playlist/6Z5EsoedIB4Cgxwv3epoIq";
    }, 3500);
  </script>
</body>
</html>
