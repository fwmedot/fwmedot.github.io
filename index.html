<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>fwme</title>

  <!-- Open Graph -->
  <meta property="og:title" content="do u (F)Wme?" />
  <meta property="og:description" content="fwme ritual" />
  <meta property="og:image" content="https://fwmedot.github.io/IMG_1040.jpeg" />
  <meta property="og:url" content="https://fwmedot.github.io" />
  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary_large_image" />

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #000;
      color: #eaeaea;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Courier New", monospace;
      font-size: 18px;
      letter-spacing: 1px;
    }

    .container {
      text-align: center;
      width: 260px;
      user-select: none;
    }

    .text {
      margin-bottom: 10px;
      position: relative;
    }

    .glitch::after {
      content: attr(data-text);
      position: absolute;
      left: 1px;
      top: 0;
      opacity: 0.2;
      animation: glitch 3s infinite;
    }

    @keyframes glitch {
      0% { opacity: 0; }
      94% { opacity: 0; }
      96% { opacity: 0.25; }
      98% { opacity: 0; }
      100% { opacity: 0; }
    }

    .dots::after {
      content: "";
      animation: dots 1.6s infinite;
    }

    @keyframes dots {
      0% { content: ""; }
      33% { content: "."; }
      66% { content: ".."; }
      100% { content: "..."; }
    }

    /* BARRA DE CARGA (RITUAL) */
    .bar {
      width: 100%;
      height: 6px;
      border: 1px solid #eaeaea;
      margin-top: 14px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: #eaeaea;
      transition: width 0.15s linear;
    }

    .choices {
      margin-top: 18px;
      display: none;
      font-size: 14px;
      line-height: 1.8;
    }

    .choice {
      cursor: pointer;
      opacity: 0.85;
    }

    .choice:hover {
      opacity: 1;
      text-decoration: underline;
    }

    /* --- PLAYER --- */
    .player {
      margin-top: 26px;
      font-size: 12px;
      opacity: 0.8;
    }

    .play-btn {
      cursor: pointer;
      margin-bottom: 6px;
    }

    .music-bar {
      width: 100%;
      height: 3px;
      border: 1px solid #444;
      overflow: hidden;
    }

    .music-fill {
      height: 100%;
      width: 0%;
      background: #eaeaea;
    }

    .visits {
      font-size: 10px;
      opacity: 0.15;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="text glitch" data-text="do u (F)Wme?">do u (F)Wme?</div>
    <div class="dots" id="status">waiting</div>

    <!-- BARRA DE CARGA -->
    <div class="bar">
      <div class="bar-fill" id="loadBar"></div>
    </div>

    <!-- PLAYLISTS -->
    <div class="choices" id="choices">
      <div class="choice" onclick="openPlaylist('a')">→ fwme</div>
      <div class="choice" onclick="openPlaylist('b')">→ dn’t fwme</div>
    </div>

    <!-- PLAYER -->
    <div class="player">
      <div class="play-btn" id="playBtn">▶ play</div>
      <div class="music-bar">
        <div class="music-fill" id="musicBar"></div>
      </div>
    </div>

    <div class="visits" id="visits"></div>
  </div>

  <!-- AUDIO -->
  <audio id="ritualAudio" preload="auto">
    <source src="january.mp3" type="audio/mpeg">
  </audio>

  <script>
    /* VISITAS */
    const COUNT_KEY = "fwmedot.github.io/fwme";
    fetch(`https://api.countapi.xyz/hit/${COUNT_KEY}`)
      .then(r => r.json())
      .then(d => {
        document.getElementById("visits").textContent = `visits: ${d.value}`;
      });

    const loadBar = document.getElementById("loadBar");
    const musicBar = document.getElementById("musicBar");
    const status = document.getElementById("status");
    const choices = document.getElementById("choices");
    const audio = document.getElementById("ritualAudio");
    const playBtn = document.getElementById("playBtn");

    /* BARRA DE CARGA FAKE */
    let progress = 0;
    const loader = setInterval(() => {
      if (progress < 100) {
        progress += Math.random() * 8;
        loadBar.style.width = Math.min(progress, 100) + "%";
      }
    }, 400);

    setTimeout(() => {
      clearInterval(loader);
      loadBar.style.width = "100%";
      status.textContent = "ready";
      choices.style.display = "block";
    }, 3200);

    /* PLAYER */
    let playing = false;

    playBtn.addEventListener("click", () => {
      if (!playing) {
        audio.play();
        playBtn.textContent = "⏸ pause";
        playing = true;
      } else {
        audio.pause();
        playBtn.textContent = "▶ play";
        playing = false;
      }
    });

    audio.addEventListener("timeupdate", () => {
      if (!audio.duration) return;
      const percent = (audio.currentTime / audio.duration) * 100;
      musicBar.style.width = percent + "%";
    });

    /* PLAYLISTS */
    function openPlaylist(type) {
      const playlists = {
        a: "https://open.spotify.com/playlist/6Z5EsoedIB4Cgxwv3epoIq",
        b: "https://open.spotify.com/playlist/69oj2W3LiWH9OsYRF3JFRs"
      };
      window.location.href = playlists[type];
    }
  </script>
</body>
</html>
